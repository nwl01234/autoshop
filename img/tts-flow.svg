<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141530"/><stop offset="1" stop-color="#0b0b14"/></linearGradient></defs>
  <rect width="900" height="460" rx="22" fill="url(#bg2)"/>
  <g font-family="Segoe UI, Arial" font-size="15">
    <rect x="55" y="60" width="240" height="330" rx="14" fill="#12142e" stroke="#7c5cff" stroke-opacity=".5"/>
    <rect x="330" y="60" width="240" height="330" rx="14" fill="#12142e" stroke="#3bf0c2" stroke-opacity=".5"/>
    <rect x="605" y="60" width="240" height="330" rx="14" fill="#12142e" stroke="#ffc86b" stroke-opacity=".5"/>
    <text x="75" y="95" fill="#c9c9ea" font-weight="700">Сценарий звонка</text>
    <text x="350" y="95" fill="#c9c9ea" font-weight="700">Ответы клиента = ветвление</text>
    <text x="625" y="95" fill="#c9c9ea" font-weight="700">Сессия + лог записи</text>
    <rect x="75" y="115" width="200" height="54" rx="10" fill="#1b1d45"/><text x="90" y="138" fill="#e6e6f5">Приветствие → оффер</text><text x="90" y="158" fill="#8d93c7" font-size="12">ключи: «привет», «слушаю»</text>
    <rect x="75" y="185" width="200" height="54" rx="10" fill="#1b1d45"/><text x="90" y="208" fill="#e6e6f5">Возражение → benefit</text><text x="90" y="228" fill="#8d93c7" font-size="12">ключи: «дорого», «не надо»</text>
    <rect x="75" y="255" width="200" height="54" rx="10" fill="#1b1d45"/><text x="90" y="278" fill="#e6e6f5">Договорились → верификация</text><text x="90" y="298" fill="#8d93c7" font-size="12">ключи: «да», «ок», «давай»</text>
    <rect x="75" y="325" width="200" height="40" rx="10" fill="#232559"/><text x="90" y="350" fill="#ffc86b" font-size="13">* → fallback реплика</text>
    <rect x="350" y="115" width="200" height="240" rx="10" fill="#1b1d45"/>
    <text x="366" y="145" fill="#e6e6f5">🎙 Клиент: «сколько стоит?»</text>
    <text x="366" y="175" fill="#3bf0c2">→ шаг ЦЕНА: «3 тарифа…»</text>
    <text x="366" y="215" fill="#e6e6f5">🎙 Клиент: «хм, а можно…»</text>
    <text x="366" y="245" fill="#3bf0c2">→ шаг УТОЧНЕНИЕ</text>
    <text x="366" y="285" fill="#e6e6f5">🎙 Тишина / фоновый шум</text>
    <text x="366" y="315" fill="#3bf0c2">→ VAD + повтор оффера</text>
    <rect x="625" y="115" width="200" height="240" rx="10" fill="#1b1d45"/>
    <text x="641" y="145" fill="#e6e6f5">calls.db (SQLite)</text>
    <text x="641" y="175" fill="#8d93c7" font-size="13">кто отвечал · текст · вайв</text>
    <text x="641" y="205" fill="#e6e6f5">exports/ — wav аудио</text>
    <text x="641" y="235" fill="#8d93c7" font-size="13">с voce клиента для разбора</text>
    <text x="641" y="265" fill="#e6e6f5">.agent.json</text>
    <text x="641" y="295" fill="#8d93c7" font-size="13">сценарий+голос+настройки одним файлом</text>
  </g>
</svg>
